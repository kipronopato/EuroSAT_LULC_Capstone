# Test the packaged models through the API and smoke test the Docker Compose services.
name: eurosat-capstone

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "notebooks/**"]
  pull_request:
    paths-ignore: ["**.md", "notebooks/**"]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install
        run: pip install -r requirements-api.txt pytest httpx

      - name: Test the API with the packaged models
        run: pytest -q

      - name: Build the Docker images
        run: docker compose build

      - name: Smoke test the containers
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/model-info
          curl --fail-with-body -F "file=@samples/River.tif" http://localhost:8000/predict
          curl --fail-with-body -F "file=@samples/Industrial.png" http://localhost:8000/predict
          curl --fail --max-time 120 -o /dev/null http://localhost:8000/map/demo
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 -o /dev/null http://localhost:8501

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down
